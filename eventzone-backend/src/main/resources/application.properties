server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/eventzone}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

spring.jackson.serialization.write-dates-as-timestamps=false

# JWT. Override JWT_SECRET (>= 32 bytes) outside local development.
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-before-production-0123456789}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
